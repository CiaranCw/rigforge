[package]
name = "rigforge_workbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "V1-2 Workbench shell: egui/eframe Asset Browser surface. Not a Preview viewer."
license = "UNLICENSED"

[dependencies]
# ab_glyph is already required by egui/epaint (Apache-2.0 OR MIT). Workbench
# uses it only to validate a discovered system CJK face before egui
# set_fonts, which panics on parse failure. No font files are vendored.
# MSRV follows egui 0.31 (rust-version 1.81).
ab_glyph = "0.2.32"
eframe = "0.31.1"
egui = "0.31.1"
rigforge_app = { path = "../app" }
rigforge_blender_worker = { path = "../blender-worker" }
rfd = "=0.17.2"
sha2 = "0.10.9"

[dev-dependencies]
rigforge_app = { path = "../app", features = ["test-support"] }
serde_json = "1.0.151"

[[bin]]
name = "rigforge_workbench"
path = "src/main.rs"
