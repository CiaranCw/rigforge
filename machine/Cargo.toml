[package]
name = "rigforge_machine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Backend-neutral stdio JSON machine interface around Application. Not a public server and not Product Domain."
license = "UNLICENSED"

[dependencies]
rigforge_app = { path = "../app" }
rigforge_domain = { path = "../domain" }
rigforge_blender_worker = { path = "../blender-worker" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "rigforge_machine"
path = "src/main.rs"

[lib]
name = "rigforge_machine"
path = "src/lib.rs"
