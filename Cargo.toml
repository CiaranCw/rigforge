[workspace]
members = ["domain", "app", "workbench", "blender-worker", "machine"]
resolver = "2"

# Compact workspace:
# - domain/ is the V1-1 Product Domain crate
# - app/ is local catalog, persistence, orchestration, and application queries
# - workbench/ is the selected GUI shell (egui/eframe), not a worker or Preview viewer
# - blender-worker/ is the V1-3 pinned isolated Blender adapter (not GUI, not Domain)
